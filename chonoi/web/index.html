<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Toàn bộ hình vẽ là vector tự vẽ bằng Canvas 2D (không có asset ngoài).
 * Độ mượt: client giữ bộ đệm snapshot, đồng bộ nhịp tick 60/s và NỘI SUY vị trí giữa hai snapshot
 * (hiển thị trễ ~3 tick); camera, góc quay, hoạt ảnh đều làm mịn theo thời gian thực.
 * Hiệu ứng / âm thanh chỉ là hình ảnh phía client, không đổi luật, không ảnh hưởng headless.
 * Phím: WASD / mũi tên = di chuyển · E = tương tác · Space = bắt cá · R = chơi lại · M = tắt/bật tiếng · ` = debug.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const TAU = Math.PI * 2;
const FONT = '"Segoe UI", "Be Vietnam Pro", system-ui, -apple-system, sans-serif';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (k, dt) => 1 - Math.exp(-k * dt);
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function strHash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

const KIND_NAME = { ca_loc: "Cá lóc", ca_linh: "Cá linh", ca_keo: "Cá kèo", bong_dien_dien: "Bông điên điển", bong_sung: "Bông súng", keo_neo: "Kèo nèo", ca_duoi: "Cá đuối", ca_bong_lau: "Cá bông lau",
  ca_he_vang: "Cá hề vàng", ca_tai_tuong: "Cá tai tượng", luon: "Lươn", luon_dien: "Lươn điện", ca_hai_tuong: "Cá hải tượng", ca_tra_dau: "Cá tra dầu" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_duoi_nuong_muoi_ot: "Cá đuối nướng muối ớt", lau_ca_bong_lau: "Lẩu cá bông lau",
  ca_he_kho_to: "Cá hề kho tộ", ca_tai_tuong_chien_xu: "Cá tai tượng chiên xù", luon_xao_sa_ot: "Lươn xào sả ớt",
  ca_hai_tuong_nuong: "Cá hải tượng nướng", lau_ca_tra_dau: "Lẩu cá tra dầu" };
const BUFF_NAME = { speed: "Tăng tốc", heal: "Hồi máu" };
const ITEMS = ["gun", "net", "armor", "tank", "fins", "knife"];
const ITEM_NAME = { gun: "Súng xiên", net: "Lưới lớn", armor: "Giáp bong bóng", tank: "Bình lặn", fins: "Chân vịt", knife: "Dao găm", basket: "Nâng cấp giỏ" };
const ITEM_DESC = {
  gun: "Space bắn mũi xiên theo hướng bơi · 12 phát mỗi buổi · 2 sát thương",
  net: "Tầm bắt rộng ×1,8 · một lần bắt hết cá trong tầm",
  armor: "Đỡ 3 cú cắn của cá khủng · vỡ rồi mới mua lại được",
  tank: "+20 giây oxy khi lặn",
  fins: "Bơi nhanh hơn 25%",
  knife: "Đánh cận chiến 2 sát thương (thay vì 1)",
  basket: "Giỏ đeo hông chứa thêm 4 ô",
};
const MOOD = {
  rat_hai_long: { label: "Rất hài lòng", color: "#ff7eb6", reviews: ["Ngon xỉu! Mai dẫn cả xóm tới.", "Nóng hổi, đậm vị miền Tây!", "Đáng đồng tiền, 10 điểm!"] },
  hai_long: { label: "Hài lòng", color: "#7be07a", reviews: ["Ăn được lắm nghen.", "Món ngon, phục vụ nhanh.", "Sẽ ghé lại."] },
  binh_thuong: { label: "Tạm được", color: "#ffd166", reviews: ["Cũng được, chờ hơi lâu.", "Bình thường thôi.", "Món hơi nguội."] },
  khong_hai_long: { label: "Không hài lòng", color: "#ff8a6a", reviews: ["Chờ mỏi cổ luôn!", "Món nguội ngắt…", "Chắc không quay lại."] },
  tuc_gian: { label: "Bỏ về", color: "#ff5d5d", reviews: ["Đợi hoài không thấy món!"] },
  that_vong: { label: "Thất vọng", color: "#9fc4ff", reviews: ["Hết món mình thích rồi…", "Tiếc ghê, lần sau quay lại.", "Quán hết nguyên liệu mất rồi."] },
};
const kname = (k) => KIND_NAME[k] || k;
const dname = (d) => DISH_NAME[d] || d || "?";

// =====================================================================================
// Mạng: input + bộ đệm snapshot + đồng bộ tick
// =====================================================================================
let latest = null, offline = false, buf = [], tickOffset = null, debug = false;
const TPS = 60, DELAY = 3;          // hiển thị trễ 3 tick (~50 ms) để luôn có 2 snapshot mà nội suy
const nowTicks = () => (performance.now() * TPS) / 1000;

const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";
function currentInput() {
  const mode = latest ? latest.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s; queue.push(s); flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function act(o) { fetch("/action", { method: "POST", body: JSON.stringify(o), headers: { "Content-Type": "application/json" } }).catch(() => {}); }
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === " " || k.startsWith("arrow") || k === "tab") e.preventDefault();
  if (e.repeat) return;
  Sound.unlock();
  if (cookUI() && panelKey(k, e)) { pushInput(); return; }
  if (shopUI() && shopKey(k, e)) { pushInput(); return; }
  if (/^[1-9]$/.test(k) && latest && latest.mode === "quan" && latest.orders && !latest.transition) {
    const o = waitingOrders()[+k - 1]; if (o) quickCook(o.dish_id); return;
  }
  if (k === "q" && latest && latest.mode === "quan" && latest.hand && latest.meta && latest.meta.day_mode) { act({ type: "trash" }); return; }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); onCatchPress(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "m") { Sound.muted = !Sound.muted; toast(Sound.muted ? "Đã tắt tiếng" : "Đã bật tiếng", "#cfd8dc"); }
  else if (k === "`" || k === "f2") { debug = !debug; e.preventDefault(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

function onSnap(s) {
  if (latest && s.tick < latest.tick) resetClient();
  else if (latest && s.mode !== latest.mode) { buf = []; G.camX = null; Q.prev = null; Q2.vis = {}; Q2.ghosts = []; Q2.prevIds = new Set(); }
  latest = s;
  if (buf.length && buf[buf.length - 1].tick === s.tick) buf[buf.length - 1] = s; else buf.push(s);
  if (buf.length > 40) buf.shift();
  const sample = nowTicks() - s.tick;
  if (tickOffset === null || sample < tickOffset) tickOffset = sample;
  else tickOffset += (sample - tickOffset) * 0.01;            // trôi chậm khi máy chủ chạy chậm
  handleEvents(s);
}
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    onSnap(await r.json());
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 12);
}
poll();

// Lấy cặp snapshot bao quanh "thời điểm hiển thị"
function sampled() {
  if (!buf.length) return null;
  const last = buf[buf.length - 1];
  if (last.finished || tickOffset === null) return { a: last, b: last, t: 0, ext: 0 };
  const rt = nowTicks() - tickOffset - DELAY;
  if (rt <= buf[0].tick) return { a: buf[0], b: buf[0], t: 0, ext: 0 };
  for (let i = buf.length - 1; i > 0; i--) {
    const a = buf[i - 1], b = buf[i];
    if (rt >= a.tick) {
      if (rt <= b.tick) return { a, b, t: (rt - a.tick) / Math.max(1, b.tick - a.tick), ext: 0 };
      break;
    }
  }
  return { a: last, b: last, t: 0, ext: Math.min(rt - last.tick, 5) };
}
function interpPlayer(S, bounds, axes) {
  const pa = S.a.player || {}, pb = S.b.player || {};
  const A = pa.pos || [0, 0], B = pb.pos || A;
  let x = lerp(A[0], B[0], S.t), y = lerp(A[1], B[1], S.t);
  const va = pa.vel || [0, 0], vb = pb.vel || va;
  const vx = lerp(va[0], vb[0], S.t), vy = lerp(va[1], vb[1], S.t);
  if (S.ext > 0 && pb.vel) { x += (vb[0] / TPS) * S.ext; y += (vb[1] / TPS) * S.ext; }
  if (bounds) {
    const bx = bounds[axes[0]], by = bounds[axes[1]];
    if (bx) x = clamp(x, bx[0], bx[1]);
    if (by) y = clamp(y, by[0], by[1]);
  }
  return { x, y, vx, vy, raw: pb };
}

// =====================================================================================
// Âm thanh (WebAudio, tự tổng hợp — không file ngoài)
// =====================================================================================
const Sound = {
  ac: null, muted: false, noiseBuf: null,
  unlock() {
    if (this.ac) { if (this.ac.state === "suspended") this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const n = this.ac.sampleRate * 0.5, b = this.ac.createBuffer(1, n, this.ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    } catch (e) { this.ac = null; }
  },
  tone(freq, dur, type = "sine", vol = 0.08, delay = 0, slide = 0) {
    if (!this.ac || this.muted) return;
    const t0 = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(this.ac.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, vol = 0.05, freq = 1200, delay = 0) {
    if (!this.ac || this.muted || !this.noiseBuf) return;
    const t0 = this.ac.currentTime + delay, s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.noiseBuf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g).connect(this.ac.destination); s.start(t0); s.stop(t0 + dur + 0.05);
  },
  play(name) {
    switch (name) {
      case "gather": this.tone(880, 0.12, "triangle", 0.07); this.tone(1320, 0.18, "triangle", 0.06, 0.07); break;
      case "fish": this.tone(420, 0.1, "sine", 0.08, 0, 2); this.tone(640, 0.12, "sine", 0.07, 0.08, 2); this.noise(0.18, 0.04, 2500); break;
      case "splash": this.noise(0.35, 0.06, 900); break;
      case "choke": this.tone(160, 0.35, "sawtooth", 0.06, 0, 0.6); break;
      case "full": this.tone(300, 0.15, "square", 0.04); this.tone(240, 0.2, "square", 0.04, 0.12); break;
      case "swing": this.noise(0.12, 0.03, 1800); break;
      case "coin": this.tone(988, 0.08, "square", 0.04); this.tone(1319, 0.25, "square", 0.04, 0.08); break;
      case "ding": this.tone(1568, 0.5, "sine", 0.07); this.tone(2093, 0.4, "sine", 0.03, 0.02); break;
      case "sizzle": this.noise(0.5, 0.04, 4000); break;
      case "pop": this.tone(660, 0.08, "sine", 0.06, 0, 1.6); break;
      case "bad": this.tone(220, 0.3, "triangle", 0.07, 0, 0.7); break;
      case "end": [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, "triangle", 0.06, i * 0.12)); break;
    }
  },
};

// =====================================================================================
// Hiệu ứng: hạt + chữ bay + thông báo
// =====================================================================================
let parts = [], toasts = [], shake = 0, flash = 0;
function emit(o) { parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, age: 0, size: 0.15, color: "#fff", kind: "dot" }, o)); }
function burst(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = (o.speed || 2) * (0.4 + Math.random() * 0.8);
    emit(Object.assign({}, o, { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), life: (o.life || 0.8) * (0.6 + Math.random() * 0.6) }));
  }
}
function floatText(x, y, text, color = "#fff", size = 18) { emit({ kind: "text", x, y, vy: -1.2, life: 1.4, text, color, size }); }
function toast(text, color = "#f3efe6", face = null) { toasts.push({ text, color, t: 0, face }); if (toasts.length > 5) toasts.shift(); }
function updateParts(dt) {
  for (const p of parts) {
    p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === "bubble") { p.vx = Math.sin(p.age * 6 + p.size * 40) * 0.4; if (p.y < (p.surface ?? -99)) p.age = p.life; }
    if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
  }
  parts = parts.filter((p) => p.age < p.life);
  for (const t of toasts) t.t += dt;
  toasts = toasts.filter((t) => t.t < 4);
  shake = Math.max(0, shake - dt * 2.5); flash = Math.max(0, flash - dt * 1.8);
}
function drawParts(W) {
  for (const p of parts) {
    const k = 1 - p.age / p.life, x = W.sx(p.x), y = W.sy(p.y), r = Math.max(0.5, p.size * W.s);
    ctx.globalAlpha = clamp(k * 1.5, 0, 1);
    if (p.kind === "text") {
      const sc = p.age < 0.15 ? 0.6 + (p.age / 0.15) * 0.5 : 1.1 - Math.min(0.1, (p.age - 0.15));
      txt(p.text, x, y, { size: p.size * sc, color: p.color, align: "center", bold: true, shadow: true });
    } else if (p.kind === "bubble") {
      ctx.strokeStyle = "rgba(220,245,255,.8)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.3, 0, TAU); ctx.fill();
    } else if (p.kind === "spark") {
      ctx.fillStyle = p.color; ctx.save(); ctx.translate(x, y); ctx.rotate(p.age * 4);
      star4(0, 0, r * (0.5 + k)); ctx.restore();
    } else if (p.kind === "ring") {
      ctx.strokeStyle = p.color; ctx.lineWidth = 2 * k + 0.5;
      ctx.beginPath(); ctx.ellipse(x, y, r * (1 + (1 - k) * 3), r * (1 + (1 - k) * 3) * (p.flat || 1), 0, 0, TAU); ctx.stroke();
    } else if (p.kind === "steam") {
      ctx.fillStyle = p.color; ctx.globalAlpha = k * 0.35;
      ctx.beginPath(); ctx.arc(x, y, r * (1 + (1 - k) * 1.5), 0, TAU); ctx.fill();
    } else if (p.kind === "coin") {
      ctx.fillStyle = "#f6c945"; ctx.strokeStyle = "#a57a12"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x, y, r * Math.abs(Math.cos(p.age * 10)) + 0.5, r, 0, 0, TAU); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y, r * k, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// =====================================================================================
// Tiện ích vẽ
// =====================================================================================
function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function txt(s, x, y, o = {}) {
  ctx.font = (o.bold ? "700 " : o.semi ? "600 " : "") + (o.size || 14) + "px " + FONT;
  ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "middle";
  if (o.shadow) { ctx.lineJoin = "round"; ctx.lineWidth = Math.max(2, (o.size || 14) / 5); ctx.strokeStyle = o.shadowColor || "rgba(10,20,30,.75)"; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || "#f3efe6"; ctx.fillText(s, x, y);
}
function textW(s, size, bold) { ctx.font = (bold ? "700 " : "") + size + "px " + FONT; return ctx.measureText(s).width; }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, alpha = 0.62) {
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
  rr(x, y, w, h, 12); ctx.fillStyle = `rgba(14,24,34,${alpha})`; ctx.fill(); ctx.restore();
  rr(x + 0.5, y + 0.5, w - 1, h - 1, 12); ctx.strokeStyle = "rgba(255,240,210,.14)"; ctx.lineWidth = 1; ctx.stroke();
}
function star4(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = (i * Math.PI) / 4, rr2 = i % 2 ? r * 0.35 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fill();
}
function star5(x, y, r, fill) {
  const path = () => { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); };
  path(); ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fill();
  if (fill > 0) { ctx.save(); ctx.beginPath(); ctx.rect(x - r, y - r, 2 * r * clamp(fill, 0, 1), 2 * r); ctx.clip(); path(); ctx.fillStyle = "#ffcf4a"; ctx.fill(); ctx.restore(); }
}
function heart(x, y, r, full, pulse = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse);
  ctx.beginPath(); ctx.moveTo(0, r * 0.9);
  ctx.bezierCurveTo(-r * 1.3, -r * 0.1, -r * 0.6, -r * 1.1, 0, -r * 0.4);
  ctx.bezierCurveTo(r * 0.6, -r * 1.1, r * 1.3, -r * 0.1, 0, r * 0.9); ctx.closePath();
  ctx.fillStyle = full ? "#ff5a6e" : "rgba(255,255,255,.12)"; ctx.fill();

let seen = new Set(), primed = false;

function handleEvents(s) {
  (s.fish || []).forEach((f) => (memo.fish[f.id] = f));
  (s.pickups || []).forEach((f) => (memo.pickups[f.id] = f));
  (s.big_fish || []).forEach((f) => (memo.big[f.id] = f));
  (s.nodes || []).forEach((n) => (memo.nodes[n.id] = n));
  (s.tables || []).forEach((t) => (memo.tables[t.id] = t));
  (s.stoves || []).forEach((t) => (memo.stoves[t.id] = t));
  (s.customers || []).forEach((c) => (memo.custTable[c.id] = c.table_id));

  const evs = s.events || [], cnt = {};
  const keys = evs.map((e) => { const k = e.tick + "|" + e.name + "|" + JSON.stringify(e.data); cnt[k] = (cnt[k] || 0) + 1; return k + "#" + cnt[k]; });

  evs.forEach((e, i) => { if (!seen.has(keys[i])) { seen.add(keys[i]); try { fx(e, s); } catch (err) { /* hiệu ứng lỗi không làm hỏng game */ } } });

      if (ready) for (let k = 0; k < 7; k++) {
        const a = k * 0.9 + t * 0.5 * 0, fx = X0 + Math.cos(a) * s * 0.45, fy = Y0 - s * 1.75 + Math.sin(a) * s * 0.3;
        ctx.fillStyle = k % 2 ? "#f2b81f" : "#ffd447"; ctx.beginPath(); ctx.ellipse(fx, fy, s * 0.17, s * 0.11, a, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (!ready) {
      const fr = 1 - (n.regrow_ticks || 0) / regrowMax;
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(X0, Y0 - s * 2.6, s * 0.4, 0, TAU); ctx.stroke();
      ctx.strokeStyle = "#a6f07a"; ctx.beginPath(); ctx.arc(X0, Y0 - s * 2.6, s * 0.4, -Math.PI / 2, -Math.PI / 2 + TAU * fr); ctx.stroke();
      txt(Math.ceil((n.regrow_ticks || 0) / 60) + "", X0, Y0 - s * 2.6, { size: Math.max(9, s * 0.38), bold: true, align: "center", shadow: true });
    }
    if (debug) txt(n.id, X0, Y0 + s * 0.6, { size: 10, align: "center", color: "#fff", shadow: true });
    const nd = Math.hypot(p.x - n.pos[0], p.y - n.pos[1]);
    if (ready && surface && nd <= (meta.interact_radius || 2) && nd < bestNd) { bestNd = nd; promptNode = n; }
  }

  // --- đàn cá ---
  const underwater = !surface;
  let promptFish = null, bestFd = 1e9;
  for (const f of L.fish || []) {
    const fd = Math.hypot(p.x - f.pos[0], p.y - f.pos[1]);
    if (underwater && fd <= (meta.catch_radius || 2) && fd < bestFd) { bestFd = fd; promptFish = f; }
  }
  for (const f of L.fish || []) {
    const seed = strHash(f.id) % 100, ph = t * 0.7 + seed;
    const wx = f.pos[0] + Math.sin(ph) * 0.45, wy = f.pos[1] + Math.sin(t * 1.1 + seed) * 0.18;
    if (sx(wx) < -80 || sx(wx) > w + 80) continue;
    const baseDir = Math.cos(((f.heading_deg || 0) * Math.PI) / 180) >= 0 ? 1 : -1;
    const dir = clamp(Math.cos(ph) * 3, -1, 1) * baseDir;
    if (f === promptFish) {
      ctx.strokeStyle = "rgba(190,250,255,.75)"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(sx(f.pos[0]), sy(f.pos[1]), s * 1.3, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    if (f.kind === "ca_linh") {
      for (let k = 0; k < 6; k++) {
        const a = k * 1.05 + seed, rx = Math.cos(a + t * 0.6) * 0.75, ry = Math.sin(a * 1.7 + t * 0.8) * 0.4;
        drawFish("ca_linh", sx(wx + rx), sy(wy + ry), s * 0.5, dir, t * 9 + k * 2);
      }
    } else drawFish(f.kind, sx(wx), sy(wy), s * (f.kind === "ca_loc" ? 1.25 : 0.8), dir, t * 6 + seed);
    if (debug) txt(f.id, sx(f.pos[0]), sy(f.pos[1]) - s * 1.2, { size: 10, align: "center", shadow: true });
  }

  // --- vật phẩm buff ---
  for (const pk of L.pickups || []) {
    const X0 = sx(pk.pos[0]), Y0 = sy(pk.pos[1] + Math.sin(t * 2 + strHash(pk.id)) * 0.2);
    if (X0 < -60 || X0 > w + 60) continue;
    drawPickup(pk.kind, X0, Y0, s, t);
  }
  // --- cá lớn (có Máu) ---
  let promptBig = null;
  const bigPrev = {}; (S.a.big_fish || []).forEach((f) => (bigPrev[f.id] = f));
  for (const f of L.big_fish || []) {
    if (!f.alive) continue;
    const fb = (S.b.big_fish || []).find((o) => o.id === f.id) || f, fa = bigPrev[f.id] || fb;
    const bxw = lerp(fa.pos[0], fb.pos[0], S.t), byw = lerp(fa.pos[1], fb.pos[1], S.t);
    const k = ((meta.extras || {}).big_kinds || {})[f.kind] || { hit_radius: 1.4 };
    G.bigDir = G.bigDir || {}; G.bigDir[f.id] = lerp(G.bigDir[f.id] ?? fb.dir, fb.dir, ease(8, dt));
    const X0 = sx(bxw), Y0 = sy(byw);
    if (X0 < -150 || X0 > w + 150) continue;
    drawBigFish(f.kind, X0, Y0, s, G.bigDir[f.id], t, f.hurt_ticks > 0, f.state);
    // thanh máu
    const bw = s * Math.max(2.2, k.hit_radius * 1.8), fr = f.hp / f.hp_max, hy = Y0 - s * (k.hit_radius + 0.7);
    rr(X0 - bw / 2, hy, bw, 7, 3); ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fill();
    rr(X0 - bw / 2, hy, Math.max(4, bw * fr), 7, 3); ctx.fillStyle = fr > 0.5 ? "#7be07a" : fr > 0.25 ? "#ffd166" : "#ff5d5d"; ctx.fill();
    txt(kname(f.kind) + (f.state === "chase" ? "  ⚠" : ""), X0, hy - 9, { size: 11, bold: true, align: "center", shadow: true, color: f.state === "chase" ? "#ffb4a2" : "#fff" });
    if (underwater && Math.hypot(p.x - bxw, p.y - byw) <= (meta.catch_radius || 2) + k.hit_radius) promptBig = f;
  }
  // --- mũi xiên ---
  for (const pr of L.projectiles || []) {
    const a = Math.atan2(pr.vel[1], pr.vel[0]), X0 = sx(pr.pos[0]), Y0 = sy(pr.pos[1]);
    ctx.save(); ctx.translate(X0, Y0); ctx.rotate(a);
    ctx.strokeStyle = "#d9d2c3"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-s * 0.9, 0); ctx.lineTo(s * 0.3, 0); ctx.stroke();
    ctx.fillStyle = "#eef3f5"; ctx.beginPath(); ctx.moveTo(s * 0.55, 0); ctx.lineTo(s * 0.25, -s * 0.12); ctx.lineTo(s * 0.25, s * 0.12); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-s * 0.9, 0); ctx.lineTo(-s * 2, 0); ctx.stroke();
    ctx.restore();
  }

  // --- người chơi (thợ lặn quàng khăn rằn) ---
  const speed = Math.hypot(p.vx, p.vy), maxSp = meta.swim_speed || 4;
  G.phase += dt * (2.2 + (speed / maxSp) * 7);
  const hd = ((praw.heading_deg || 0) * Math.PI) / 180;
  if (Math.cos(hd) < -0.2) G.facing = -1; else if (Math.cos(hd) > 0.2) G.facing = 1;
  let target = surface ? (G.facing > 0 ? -0.18 : Math.PI + 0.18) : hd;
  if (surface && speed < 0.3) target = G.facing > 0 ? -0.5 : Math.PI + 0.5;
  G.ang += angDiff(G.ang, target) * ease(9, dt);
  const visY = surface ? Math.max(p.y, wave(p.x, t)) + 0.32 : p.y;
  const PX = sx(p.x), PY = sy(visY);
  // bong bóng thở
  G.nextBubble -= dt;
  const oxyFrac = praw.oxygen_max_ticks ? praw.oxygen_ticks / praw.oxygen_max_ticks : 1;
  if (underwater && G.nextBubble <= 0) {
    G.nextBubble = oxyFrac < 0.25 ? 0.12 : 0.45 + Math.random() * 0.3;
    emit({ kind: "bubble", x: p.x + Math.cos(G.ang) * 0.6, y: visY + Math.sin(G.ang) * 0.6 - 0.2, vy: -1.6 - Math.random(), life: 4, size: 0.07 + Math.random() * 0.08, surface: 0.1 });
  }
  if (surface && speed > 0.5) { G.wake -= dt; if (G.wake <= 0) { G.wake = 0.12; emit({ kind: "dot", x: p.x - G.facing * 0.7, y: wave(p.x, t) - 0.05, vx: -G.facing * 1.2, vy: -1.5, g: 8, life: 0.5, size: 0.09, color: "#eafcff" }); } }
  if (underwater && meta.catch_radius) {
    const cd = praw.catch_cd_ticks || 0;
    ctx.strokeStyle = promptFish ? "rgba(190,250,255,.45)" : "rgba(255,255,255,.14)"; ctx.lineWidth = 1.5;
    const gear = gearOf(), netOn = (gear.slots || []).includes("net");
    const cr = gear.catch_radius || meta.catch_radius;
    if (netOn) { ctx.save(); ctx.setLineDash([3, 5]); ctx.strokeStyle = "rgba(255,226,120,.55)"; ctx.lineDashOffset = -t * 10; }
    ctx.beginPath(); ctx.arc(PX, PY, cr * s, 0, TAU); ctx.stroke();
    if (netOn) ctx.restore();
    if (gearAmmo() > 0) { // ngắm theo hướng mặt
      const ha = ((praw.heading_deg || 0) * Math.PI) / 180, rng = ((((shopCfg() || {}).items || {}).gun || {}).range || 10) * s;
      ctx.save(); ctx.setLineDash([2, 8]); ctx.strokeStyle = "rgba(255,180,140,.6)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(PX + Math.cos(ha) * rng, PY + Math.sin(ha) * rng); ctx.stroke(); ctx.restore();
    }
    if (cd > 0) { const cdm = (meta.catch_cooldown_s || 0.5) * 60; ctx.strokeStyle = "rgba(255,210,120,.8)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(PX, PY, s * 1.1, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - cd / cdm)); ctx.stroke(); }
  }
  const blink = praw.invuln_ticks > 0 && Math.floor(t * 12) % 2;
  if (!blink) drawDiver(PX, PY, s, G.ang, G.phase, surface, t, speed / maxSp, gearOf(), L.hold || [], L.hold_capacity || 12);
  if (surface) { // nước phủ phần thân chìm
    ctx.save(); ctx.beginPath(); ctx.moveTo(PX - s * 2, PY + s * 2);
    for (let k = -2; k <= 2.01; k += 0.25) ctx.lineTo(PX + k * s, sy(wave(p.x + k, t)));
    ctx.lineTo(PX + s * 2, PY + s * 2); ctx.closePath();
    const og = ctx.createLinearGradient(PX - s * 2, 0, PX + s * 2, 0);
    og.addColorStop(0, "rgba(70,160,165,0)"); og.addColorStop(0.3, "rgba(70,160,165,.45)"); og.addColorStop(0.7, "rgba(70,160,165,.45)"); og.addColorStop(1, "rgba(70,160,165,0)");
    ctx.fillStyle = og; ctx.fill(); ctx.restore();
  }
  if (surface) { ctx.strokeStyle = "rgba(235,252,255,.55)"; ctx.lineWidth = 1.5; const rp = (t * 0.8) % 1; ctx.beginPath(); ctx.ellipse(PX, sy(wave(p.x, t)), s * (0.6 + rp * 1.3), s * (0.12 + rp * 0.2), 0, 0, TAU); ctx.globalAlpha = 1 - rp; ctx.stroke(); ctx.globalAlpha = 1; }
  // vung vợt bắt cá
  G.catchT += dt;
  if (G.catchT < 0.28) {
    const k = G.catchT / 0.28, R = (meta.catch_radius || 2) * s, a0 = G.ang - 1.2 + k * 2.4;
    ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - k)})`; ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(PX, PY, R * 0.85, G.ang - 1.2, a0); ctx.stroke();
    ctx.save(); ctx.translate(PX + Math.cos(a0) * R * 0.85, PY + Math.sin(a0) * R * 0.85); ctx.rotate(a0);
    ctx.strokeStyle = "rgba(240,230,200,.9)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, s * 0.35, 0, TAU); ctx.stroke(); ctx.restore();
  }

  drawParts(W);

  // nhắc phím
  if (L.finished) { /* không nhắc */ }
  else if (nearShop && surface && !shopUI()) keycap(Math.max(150, sx(shopCfg().pos[0])), sy(-3.6), "E", "Mua đồ lặn", t);
  else if (inDock && surface) keycap(Math.max(150, PX), Math.max(150, PY - s * 1.6), "E", "Cập bến bán hàng", t);
  else if (promptNode) keycap(sx(promptNode.pos[0]), sy(-2.9), "E", "Hái " + kname(promptNode.kind).toLowerCase(), t);
  else if (promptBig && !(gearAmmo() > 0)) keycap(sx(promptBig.pos[0]), sy(promptBig.pos[1] - 2.6), "Space", "Đánh " + kname(promptBig.kind).toLowerCase(), t);
  else if (promptFish && !(praw.catch_cd_ticks > 0)) keycap(sx(promptFish.pos[0]), sy(promptFish.pos[1] - 1.6), "Space", "Bắt " + kname(promptFish.kind).toLowerCase(), t);

  // --- lớp phủ: oxy thấp / ngạt ---
  if (underwater && oxyFrac < 0.3) {
    const k = (0.3 - oxyFrac) / 0.3, pulse = 0.75 + Math.sin(t * (oxyFrac <= 0 ? 10 : 5)) * 0.25;
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.7);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, oxyFrac <= 0 ? `rgba(120,10,20,${0.65 * pulse})` : `rgba(5,15,40,${0.7 * k * pulse})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,40,60,${flash * 0.25})`; ctx.fillRect(0, 0, w, h); }

  hudGather(w, h, L, p, praw, t, X, D);
  drawShopPanel(w, h, t);
}

function drawFish(kind, x, y, sz, dir, ph) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir || 1, 1);
  const wag = Math.sin(ph) * 0.35;
  if (kind === "ca_loc") {
    ctx.fillStyle = "#2f3b22";
    ctx.save(); ctx.translate(-sz * 0.7, 0); ctx.rotate(wag);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-sz * 0.4, -sz * 0.35, -sz * 0.55, -sz * 0.1); ctx.quadraticCurveTo(-sz * 0.6, sz * 0.1, -sz * 0.55, sz * 0.15); ctx.quadraticCurveTo(-sz * 0.4, sz * 0.35, 0, 0); ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.moveTo(-sz * 0.55, -sz * 0.18); ctx.quadraticCurveTo(0, -sz * 0.42, sz * 0.45, -sz * 0.2); ctx.lineTo(sz * 0.4, -sz * 0.1); ctx.lineTo(-sz * 0.55, -sz * 0.1); ctx.fill();

    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, sz * 0.8, sz * 0.24, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(25,30,15,.55)"; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-sz * 0.45 + i * sz * 0.26, -sz * 0.02, sz * 0.09, sz * 0.12, 0, 0, TAU); ctx.fill(); }
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(sz * 0.58, -sz * 0.06, sz * 0.06, 0, TAU); ctx.fill();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(sz * 0.6, -sz * 0.06, sz * 0.035, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sz * 0.8, sz * 0.04); ctx.lineTo(sz * 0.62, sz * 0.07); ctx.stroke();

    ctx.save(); ctx.translate(-sz * 0.5, 0); ctx.rotate(wag);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-sz * 0.35, -sz * 0.35, -sz * 0.42, 0); ctx.quadraticCurveTo(-sz * 0.35, sz * 0.35, 0, 0); ctx.fill();
    ctx.fillStyle = "#ff8c1a"; ctx.beginPath(); ctx.moveTo(-sz * 0.02, 0); ctx.quadraticCurveTo(-sz * 0.3, -sz * 0.28, -sz * 0.36, 0); ctx.quadraticCurveTo(-sz * 0.3, sz * 0.28, -sz * 0.02, 0); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#ff8c1a"; ctx.beginPath(); ctx.ellipse(0, 0, sz * 0.55, sz * 0.32, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, sz * 0.55, sz * 0.32, 0, 0, TAU); ctx.clip();
    for (const bx of [-0.3, 0.05, 0.38]) { ctx.fillStyle = "#1b1b1b"; ctx.fillRect(sz * (bx - 0.08), -sz * 0.4, sz * 0.16, sz * 0.8); ctx.fillStyle = "#fff"; ctx.fillRect(sz * (bx - 0.06), -sz * 0.4, sz * 0.12, sz * 0.8); }
    ctx.restore();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(sz * 0.32, -sz * 0.06, sz * 0.06, 0, TAU); ctx.fill();
  } else if (kind === "ca_tai_tuong") {

    const g2 = ctx.createLinearGradient(0, -sz * 0.45, 0, sz * 0.45); g2.addColorStop(0, "#7c6f80"); g2.addColorStop(0.5, "#c9b8c4"); g2.addColorStop(1, "#efe2e8");
    ctx.fillStyle = g2; ctx.beginPath(); ctx.ellipse(0, 0, sz * 0.62, sz * 0.45, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#e8c8a0"; ctx.lineWidth = Math.max(1, sz * 0.04);
    ctx.beginPath(); ctx.moveTo(sz * 0.1, sz * 0.35); ctx.quadraticCurveTo(-sz * 0.1, sz * 0.7, -sz * 0.4, sz * 0.75 + Math.sin(ph) * sz * 0.05); ctx.stroke();

    const g = ctx.createLinearGradient(0, -sz * 0.3, 0, sz * 0.3); g.addColorStop(0, c[1]); g.addColorStop(0.45, c[0]); g.addColorStop(1, c[2]);

    ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.beginPath(); ctx.ellipse(-sz * 0.05, -sz * 0.1, sz * 0.35, sz * 0.05, 0, 0, TAU); ctx.fill();

  }
  ctx.restore();
}

function drawDiver(x, y, s, ang, ph, surface, t, spd, gear, hold, cap) {
  gear = gear || { slots: [] }; const has = (it) => (gear.slots || []).includes(it);
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  if (Math.cos(ang) < 0) ctx.scale(1, -1);
  const u = s * 1.35;  // thân ~1.8 m: to hơn thực tế chút cho dễ nhìn
  const kick = Math.sin(ph) * 0.14, kick2 = Math.sin(ph + Math.PI) * 0.14;
  const skin = "#d99a6c", shirt = "#2f4d7a", pants = "#1f2430";
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // bóng mờ dưới nước
  if (!surface) { ctx.fillStyle = "rgba(0,20,30,.15)"; ctx.beginPath(); ctx.ellipse(0, u * 0.35, u * 0.9, u * 0.12, 0, 0, TAU); ctx.fill(); }
  // chân sau
  const leg = (k, shade) => {
    ctx.strokeStyle = shade; ctx.lineWidth = u * 0.16;
    ctx.beginPath(); ctx.moveTo(-u * 0.2, u * 0.03); ctx.quadraticCurveTo(-u * 0.5, u * (0.05 + k), -u * 0.78, u * (k * 1.6)); ctx.stroke();
    if (has("fins")) { // chân vịt
      ctx.save(); ctx.translate(-u * 0.86, u * (k * 1.6)); ctx.rotate(k * 2 + Math.PI);
      ctx.fillStyle = "#2ecc71"; ctx.beginPath(); ctx.moveTo(0, -u * 0.06); ctx.lineTo(u * 0.4, -u * 0.13); ctx.quadraticCurveTo(u * 0.36, 0, u * 0.4, u * 0.13); ctx.lineTo(0, u * 0.06); ctx.closePath(); ctx.fill(); ctx.restore();
    } else { ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(-u * 0.86, u * (k * 1.6), u * 0.1, u * 0.06, k * 2, 0, TAU); ctx.fill(); }
  };
  // bình lặn trên lưng (vẽ trước thân)
  if (has("tank")) {
    const tg2 = ctx.createLinearGradient(0, -u * 0.42, 0, -u * 0.16); tg2.addColorStop(0, "#ffe27a"); tg2.addColorStop(1, "#c79400");
    ctx.fillStyle = tg2; rr(-u * 0.3, -u * 0.42, u * 0.62, u * 0.24, u * 0.12); ctx.fill();
    ctx.fillStyle = "#555"; ctx.fillRect(u * 0.3, -u * 0.36, u * 0.08, u * 0.1);
    ctx.strokeStyle = "#222"; ctx.lineWidth = u * 0.025; ctx.beginPath(); ctx.moveTo(u * 0.36, -u * 0.31); ctx.quadraticCurveTo(u * 0.55, -u * 0.32, u * 0.6, -u * 0.08); ctx.stroke();
    ctx.fillStyle = "#222"; ctx.fillRect(-u * 0.1, -u * 0.2, u * 0.04, u * 0.12); ctx.fillRect(u * 0.15, -u * 0.2, u * 0.04, u * 0.12);
  }
  if (has("net")) { // lưới cuộn sau lưng
    ctx.save(); ctx.translate(has("tank") ? -u * 0.42 : -u * 0.15, -u * 0.25); ctx.rotate(-0.4); drawGearIcon("net", 0, 0, u * 0.16); ctx.restore();
  }
  leg(kick2, "#151922");
  // tay sau

    if (st.state === "cooking" && Math.random() < dt * 6) emit({ kind: "steam", x: st.pos[0] + (Math.random() - 0.5) * 0.6, y: st.pos[1] + 0.2, vy: 0.9, vx: (Math.random() - 0.5) * 0.3, life: 1.3, size: 0.22, color: "#fff" });
    if (st.state === "ready" && Math.random() < dt * 10) emit({ kind: "steam", x: st.pos[0] + (Math.random() - 0.5) * 0.6, y: st.pos[1] + 0.2, vy: 1.2, vx: (Math.random() - 0.5) * 0.3, life: 1.4, size: 0.26, color: "#fff" });
    // tiến độ
    if (st.state === "cooking") {
      Q.cookMax[st.id] = Math.max(Q.cookMax[st.id] || 0, st.cook_ticks_left || 0);
      const fr = 1 - (st.cook_ticks_left || 0) / Math.max(1, Q.cookMax[st.id]);
      ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(X0, Y0, s * 1.05, 0, TAU); ctx.stroke();
      ctx.strokeStyle = "#ffb347"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(X0, Y0, s * 1.05, -Math.PI / 2, -Math.PI / 2 + TAU * fr); ctx.stroke(); ctx.lineCap = "butt";
      txt(Math.ceil((st.cook_ticks_left || 0) / 60) + "s", X0, Y0 + s * 1.55, { size: Math.max(11, s * 0.36), bold: true, align: "center", shadow: true });
    } else { Q.cookMax[st.id] = 0; }
    if (st.state === "ready") {
      const pu = 0.5 + Math.sin(t * 6) * 0.5;
      ctx.strokeStyle = `rgba(150,255,120,${0.5 + pu * 0.5})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(X0, Y0, s * (1.05 + pu * 0.1), 0, TAU); ctx.stroke();
      const by = Math.sin(t * 5) * s * 0.1;
      bubble(X0, Y0 - s * 1.75 + by, s * 0.55, () => drawDish(st.dish, X0, Y0 - s * 1.75 + by, s * 0.4), "#e8ffd8");
    }
    if (debug) txt(st.id, X0, Y0, { size: 11, align: "center", shadow: true });
    // gợi ý thao tác
    const d = Math.hypot(p.x - st.pos[0], p.y - st.pos[1]);
    if (!L.hand && st.state === "idle") {
      const c = custs.find((c) => c.state === "assigned" && !cooking.has(c.id));
      if (c) consider(d, { x: st.pos[0], y: st.pos[1] + 2.1, label: "Nấu " + dname(c.dish_id).toLowerCase() });
    } else if (!L.hand && st.state === "ready") consider(d, { x: st.pos[0], y: st.pos[1] + 2.4, label: "Lấy món" });
  }

  // --- bàn + khách ---
  const byTable = {}; custs.forEach((c) => (byTable[c.table_id] = c));
  const patDefault = (meta.patience_s || 60) * 60, eatMax = (meta.eat_s || 10) * 60;
  for (const tb of L.tables || []) {
    const X0 = sx(tb.pos[0]), Y0 = sy(tb.pos[1]), c = byTable[tb.id];
    // ghế đẩu
    for (let k = 0; k < 4; k++) {
      const a = Math.PI / 4 + (k * Math.PI) / 2 - Math.PI / 2 * 0, sx2 = X0 + Math.cos(a - Math.PI / 4 - Math.PI / 2) * s * 1.35, sy2 = Y0 + Math.sin(a - Math.PI / 4 - Math.PI / 2) * s * 1.35;
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.arc(sx2 + 2, sy2 + 3, s * 0.3, 0, TAU); ctx.fill();
      ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.arc(sx2, sy2, s * 0.3, 0, TAU); ctx.fill();
      ctx.fillStyle = "#e05a48"; ctx.beginPath(); ctx.arc(sx2 - s * 0.05, sy2 - s * 0.05, s * 0.2, 0, TAU); ctx.fill();
    }
    // mặt bàn
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.arc(X0 + 3, Y0 + 5, s * 0.95, 0, TAU); ctx.fill();
    const tg = ctx.createRadialGradient(X0 - s * 0.3, Y0 - s * 0.3, 0, X0, Y0, s * 0.95); tg.addColorStop(0, "#9a6436"); tg.addColorStop(1, "#6e4220");
    ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(X0, Y0, s * 0.95, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,220,170,.18)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(X0, Y0, s * 0.7, 0, TAU); ctx.stroke();
    // ống đũa
    ctx.fillStyle = "#c79b5e"; ctx.beginPath(); ctx.arc(X0 + s * 0.45, Y0 + s * 0.4, s * 0.12, 0, TAU); ctx.fill();
    if (c) {
      if (Q.pop[c.id] === undefined) Q.pop[c.id] = 0;
      Q.pop[c.id] = Math.min(1, Q.pop[c.id] + dt * 4);
      const pop = 1 - Math.pow(1 - Q.pop[c.id], 3);
      const cx = X0, cy = Y0 - s * 1.35;   // ngồi phía bắc
      if (c.state === "eating" && c.dish_id) drawDish(c.dish_id, X0, Y0 - s * 0.1, s * 0.42);
      drawCustomer(cx, cy, s * 1.2 * pop, c, t);
      if (c.state === "eating") {
        const fr = 1 - (c.eat_ticks_left || 0) / eatMax;
        txt("đang ăn…", cx, cy - s * 1.0, { size: Math.max(10, s * 0.3), semi: true, align: "center", color: "#d4ffb0", shadow: true });
        rr(cx - s * 0.6, cy - s * 0.78, s * 1.2, 5, 3); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();
        rr(cx - s * 0.6, cy - s * 0.78, s * 1.2 * fr, 5, 3); ctx.fillStyle = "#8be07a"; ctx.fill();
      } else {
        const pmax = c.patience_ticks_max || patDefault, fr = clamp((c.patience_ticks_left || 0) / pmax, 0, 1);
        const jit = fr < 0.25 ? Math.sin(t * 30) * 2 : 0;
        const bx = cx + jit, byy = cy - s * 1.3 + Math.sin(t * 2.5 + strHash(c.id)) * 2;
        bubble(bx, byy, s * 0.58 * pop, () => c.dish_id ? drawDish(c.dish_id, bx, byy, s * 0.4 * pop) : txt("?", bx, byy, { size: s * 0.5, bold: true, align: "center", color: "#3a2a1a" }), "#fff8ea");
        const pc = fr > 0.5 ? "#7be07a" : fr > 0.25 ? "#ffd166" : "#ff6b6b";
        ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, byy, s * 0.7 * pop, 0, TAU); ctx.stroke();
        ctx.strokeStyle = pc; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(bx, byy, s * 0.7 * pop, -Math.PI / 2, -Math.PI / 2 + TAU * fr); ctx.stroke(); ctx.lineCap = "butt";
      }
      // gợi ý phục vụ
      if (L.hand && c.state === "assigned") {
        const hd = typeof L.hand === "string" ? L.hand : L.hand.dish_id, hc = typeof L.hand === "string" ? null : L.hand.customer_id;
        if (hd === c.dish_id && (!hc || hc === c.id)) consider(Math.hypot(p.x - tb.pos[0], p.y - tb.pos[1]), { x: tb.pos[0], y: tb.pos[1] + 3.1, label: "Phục vụ" });
      }
    }
    if (debug) txt(tb.id, X0, Y0, { size: 11, align: "center", shadow: true });
  }

  // --- đèn lồng dây (trên cùng) ---
  for (const zz of [Z + 0.25]) {
    ctx.strokeStyle = "rgba(30,20,10,.8)"; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let i = 0; i <= 40; i++) { const xx = (i / 40) * X, sag = Math.sin(((i % 10) / 10) * Math.PI) * 0.35; ctx.lineTo(sx(xx), sy(zz - sag)); }
    ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const xx = (i + 0.5) * (X / 4), sw = Math.sin(t * 1.6 + i) * s * 0.06, lx = sx(xx) + sw, ly = sy(zz - 0.35) + s * 0.25;
      const gl = ctx.createRadialGradient(lx, ly, 0, lx, ly, s * 2.2); gl.addColorStop(0, "rgba(255,170,70,.35)"); gl.addColorStop(1, "rgba(255,150,50,0)");
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = gl; ctx.fillRect(lx - s * 2.2, ly - s * 2.2, s * 4.4, s * 4.4); ctx.restore();
      ctx.fillStyle = i % 2 ? "#e8473a" : "#f2a23a"; ctx.beginPath(); ctx.ellipse(lx, ly, s * 0.3, s * 0.38, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#f6d36b"; ctx.fillRect(lx - s * 0.16, ly - s * 0.42, s * 0.32, s * 0.08); ctx.fillRect(lx - s * 0.16, ly + s * 0.34, s * 0.32, s * 0.08);
    }
  }

  // --- người chơi (đầu bếp đội nón lá) ---
  if (Q.prev) {
    const mvx = p.x - Q.prev[0], mvz = p.y - Q.prev[1], sp = Math.hypot(mvx, mvz) / Math.max(dt, 1e-3);
    if (sp > 0.4) Q.face += angDiff(Q.face, Math.atan2(-mvz, mvx)) * ease(12, dt);
    Q.walk += dt * sp * 3.2; Q.speed = lerp(Q.speed || 0, sp, ease(10, dt));
  }
  Q.prev = [p.x, p.y];
  const PX = sx(p.x), PY = sy(p.y);
  ctx.save(); ctx.strokeStyle = hint ? "rgba(255,236,170,.6)" : "rgba(255,255,255,.2)"; ctx.setLineDash([5, 5]); ctx.lineDashOffset = -t * 15; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(PX, PY, radius * s, 0, TAU); ctx.stroke(); ctx.restore();
  drawChef(PX, PY, s * 1.25, Q.face, Q.walk, clamp((Q.speed || 0) / (meta.walk_speed || 4), 0, 1), L.hand, t);

  drawParts(W);
  if (hint && !L.finished) keycap(sx(hint.x), sy(hint.y), "E", hint.label, t);
  if (flash > 0) { ctx.fillStyle = `rgba(255,40,60,${flash * 0.2})`; ctx.fillRect(0, 0, w, h); }
  hudQuan(w, h, L, t);
}

function bubble(x, y, r, inner, bg) {
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - r * 0.25, y + r * 0.85); ctx.lineTo(x, y + r * 1.35); ctx.lineTo(x + r * 0.25, y + r * 0.85); ctx.fill(); ctx.restore();
  inner();
}

function drawCustomer(x, y, s, c, t) {
  if (s < 1) return;
  const hsh = strHash(c.id), shirts = ["#3b7dd8", "#d8693b", "#6a4fb3", "#2f9e7a", "#c2456b", "#8a8a2f"], shirt = shirts[hsh % shirts.length];
  const hat = hsh % 3 === 0, angry = c.state !== "eating" && c.patience_ticks_left !== undefined && c.patience_ticks_left / (c.patience_ticks_max || 3600) < 0.25;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(2, 4, s * 0.5, s * 0.35, 0, 0, TAU); ctx.fill();
  // tay (đang ăn thì cầm đũa đưa vào bàn)
  const eat = c.state === "eating", ch = eat ? Math.sin(t * 8) * s * 0.08 : 0;
  ctx.fillStyle = "#d99a6c";
  ctx.beginPath(); ctx.arc(-s * 0.38, s * 0.28 + ch, s * 0.11, 0, TAU); ctx.arc(s * 0.38, s * 0.28 - ch, s * 0.11, 0, TAU); ctx.fill();
  if (eat) { ctx.strokeStyle = "#e8d6a8"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(s * 0.38, s * 0.28 - ch); ctx.lineTo(s * 0.3, s * 0.75 - ch); ctx.moveTo(s * 0.42, s * 0.28 - ch); ctx.lineTo(s * 0.38, s * 0.75 - ch); ctx.stroke(); }
  // vai
  ctx.fillStyle = shirt; ctx.beginPath(); ctx.ellipse(0, s * 0.05, s * 0.45, s * 0.28, 0, 0, TAU); ctx.fill();
  // đầu
  if (hat) {
    ctx.fillStyle = "#e6cf8f"; ctx.beginPath(); ctx.arc(0, -s * 0.02, s * 0.36, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(140,110,50,.5)"; ctx.lineWidth = 1; for (let k = 1; k < 3; k++) { ctx.beginPath(); ctx.arc(0, -s * 0.02, s * 0.12 * k, 0, TAU); ctx.stroke(); }
  } else {
    ctx.fillStyle = "#d99a6c"; ctx.beginPath(); ctx.arc(0, -s * 0.02, s * 0.24, 0, TAU); ctx.fill();
    ctx.fillStyle = hsh % 2 ? "#1b1410" : "#3a2a1e"; ctx.beginPath(); ctx.arc(0, -s * 0.07, s * 0.23, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  }
  if (angry) { ctx.fillStyle = "#ff5d5d"; txt("💢", s * 0.35, -s * 0.35, { size: Math.max(10, s * 0.35), align: "center" }); }
  ctx.restore();
}

function drawChef(x, y, s, face, walk, spd, hand, t) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(3, 5, s * 0.5, s * 0.4, 0, 0, TAU); ctx.fill();
  ctx.rotate(face);
  const sw = Math.sin(walk) * 0.25 * spd, bob = 1 + Math.abs(Math.sin(walk)) * 0.04 * spd;
  ctx.scale(bob, bob);
  // chân bước
  ctx.fillStyle = "#1f2430";
  ctx.beginPath(); ctx.ellipse(s * sw, -s * 0.16, s * 0.14, s * 0.09, 0, 0, TAU); ctx.ellipse(-s * sw, s * 0.16, s * 0.14, s * 0.09, 0, 0, TAU); ctx.fill();
  // tay
  ctx.fillStyle = "#d99a6c";
  if (hand) { ctx.beginPath(); ctx.arc(s * 0.42, -s * 0.22, s * 0.1, 0, TAU); ctx.arc(s * 0.42, s * 0.22, s * 0.1, 0, TAU); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(-s * sw * 0.9 + s * 0.05, -s * 0.36, s * 0.1, 0, TAU); ctx.arc(s * sw * 0.9 + s * 0.05, s * 0.36, s * 0.1, 0, TAU); ctx.fill(); }
  // thân: áo bà ba nâu + tạp dề
  ctx.fillStyle = "#7a4a2a"; ctx.beginPath(); ctx.ellipse(0, 0, s * 0.3, s * 0.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#f1ead8"; ctx.beginPath(); ctx.ellipse(s * 0.1, 0, s * 0.18, s * 0.3, 0, 0, TAU); ctx.fill();
  // khăn rằn quàng cổ
  ctx.fillStyle = "#1a1a1a"; ctx.beginPath(); ctx.ellipse(s * 0.02, 0, s * 0.08, s * 0.28, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#f2ede0"; for (let k = -2; k <= 2; k++) ctx.fillRect(s * 0.0, k * s * 0.1 - s * 0.03, s * 0.05, s * 0.05);
  // nón lá
  const hg = ctx.createRadialGradient(-s * 0.08, -s * 0.08, 0, 0, 0, s * 0.46); hg.addColorStop(0, "#fff3c4"); hg.addColorStop(1, "#d8b866");
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, 0, s * 0.46, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(140,105,40,.45)"; ctx.lineWidth = 1;
  for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(0, 0, s * 0.115 * k, 0, TAU); ctx.stroke(); }
  for (let k = 0; k < 12; k++) { const a = (k / 12) * TAU; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * s * 0.46, Math.sin(a) * s * 0.46); ctx.stroke(); }
  ctx.fillStyle = "#b8923e"; ctx.beginPath(); ctx.arc(0, 0, s * 0.04, 0, TAU); ctx.fill();
  // khay món
  if (hand) {
    const id = typeof hand === "string" ? hand : hand.dish_id;
    ctx.fillStyle = "#6b4a2b"; rr(s * 0.42, -s * 0.34, s * 0.62, s * 0.68, s * 0.12); ctx.fill();
    ctx.rotate(-face); const hx = Math.cos(face) * s * 0.73, hy = Math.sin(face) * s * 0.73;
    drawDish(id, hx, hy, s * 0.28);
  }
  ctx.restore();
}

function hudQuan(w, h, L, t) {
  const meta = L.meta || {}, compact = w < 760;
  panel(12, 12, compact ? w - 24 : 430, 64);
  const tmax = (meta.duration_s || 180) * 60;
  clockIcon(34, 44, 12, (L.time_left_ticks || 0) / tmax);
  txt(fmtTime(L.time_left_ticks), 54, 45, { size: 22, bold: true });
  // tiền
  const mx = 130; Q.money = Q.money === undefined ? (L.money || 0) : lerp(Q.money, L.money || 0, 0.15);
  ctx.fillStyle = "#f6c945"; ctx.beginPath(); ctx.arc(mx, 44, 10, 0, TAU); ctx.fill(); ctx.strokeStyle = "#a57a12"; ctx.lineWidth = 1.5; ctx.stroke();
  txt("₫", mx, 45, { size: 11, bold: true, color: "#7a5a0a", align: "center" });
  txt(Math.round(Q.money) + "k", mx + 16, 45, { size: 20, bold: true, color: "#ffe48a" });
  // uy tín
  const rep = L.reputation ?? 0, rmax = meta.reputation_max || 5, rx = mx + 95;
  txt("Uy tín", rx, 28, { size: 10, semi: true, color: "#cfd8dc" });
  for (let i = 0; i < rmax; i++) star5(rx + 8 + i * 19, 48, 8, rep - i);
  if (!compact) { txt("Điểm", rx + rmax * 19 + 18, 28, { size: 10, semi: true, color: "#cfd8dc" }); txt(String(L.score ?? 0), rx + rmax * 19 + 18, 48, { size: 18, bold: true }); }
  // phiếu gọi món
  const orders = (L.customers || []).slice(0, 5);
  let ox = compact ? 12 : 454;
  const oy = compact ? 84 : 12;
  for (const c of orders) {
    const cw = 150; if (ox + cw > w - 8) break;
    panel(ox, oy, cw, 64, 0.72);
    if (c.dish_id) drawDish(c.dish_id, ox + 26, oy + 32, 15);
    txt(dname(c.dish_id), ox + 48, oy + 22, { size: 11, bold: true });
    txt("Bàn " + c.table_id + (c.state === "eating" ? " · đang ăn" : ""), ox + 48, oy + 38, { size: 10, color: "#cfd8dc" });
    if (c.state !== "eating") {
      const fr = clamp((c.patience_ticks_left || 0) / (c.patience_ticks_max || 3600), 0, 1);
      rr(ox + 48, oy + 48, cw - 60, 6, 3); ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fill();
      rr(ox + 48, oy + 48, (cw - 60) * fr, 6, 3); ctx.fillStyle = fr > 0.5 ? "#7be07a" : fr > 0.25 ? "#ffd166" : "#ff6b6b"; ctx.fill();
    }
    ox += cw + 8;
  }
  // kho
  const stock = L.stock || {}, keys = Object.keys(stock);
  const sw = Math.max(170, 30 + keys.length * 70), sy0 = h - 62;
  panel(12, sy0, sw, 50);
  txt("Kho", 24, sy0 + 14, { size: 11, bold: true, color: "#ffe7b5" });
  if (!keys.length) txt("(trống)", 24, sy0 + 34, { size: 12, color: "#9fb3c0" });
  keys.forEach((k, i) => { drawItem(k, 36 + i * 70, sy0 + 33, 11); txt("×" + stock[k], 52 + i * 70, sy0 + 34, { size: 14, bold: true }); });
  if (!compact) controlsHint(w, h, [["WASD", "Đi"], ["E", "Nấu / Lấy / Phục vụ"], ["R", "Chơi lại"], ["M", "Tiếng"]]);
}

function drawBuffIcon(kind, x, y, r) {
  ctx.save(); ctx.translate(x, y);
  if (kind === "heal") {
    heartSmall(0, r * 0.05, r * 0.75);
    ctx.fillStyle = "#fff"; ctx.fillRect(-r * 0.08, -r * 0.35, r * 0.16, r * 0.5); ctx.fillRect(-r * 0.25, -r * 0.18, r * 0.5, r * 0.16);
  } else if (kind === "speed") {
    ctx.fillStyle = "#b8ff8a"; ctx.beginPath();
    ctx.moveTo(r * 0.2, -r); ctx.lineTo(-r * 0.5, r * 0.1); ctx.lineTo(-r * 0.02, r * 0.1); ctx.lineTo(-r * 0.25, r); ctx.lineTo(r * 0.55, -r * 0.15); ctx.lineTo(r * 0.05, -r * 0.15); ctx.closePath(); ctx.fill();
  } else drawGearIcon(kind, 0, 0, r);
  ctx.restore();
}
function drawPickup(kind, x, y, s, t) {
  const r = s * 0.55, col = kind === "heal" ? "255,130,160" : "170,255,130";
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
  g.addColorStop(0, `rgba(${col},.55)`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.strokeStyle = `rgba(${col},.95)`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(x - r * 0.4, y - r * 0.45, r * 0.15, 0, TAU); ctx.fill();
  drawBuffIcon(kind, x, y, r * 0.6);
  ctx.globalAlpha = 0.5 + Math.sin(t * 4) * 0.3;
  txt(BUFF_NAME[kind] || kind, x, y + r + 10, { size: 11, bold: true, align: "center", shadow: true });
  ctx.globalAlpha = 1;
}
// biểu tượng đồ nghề (tiệm, ô đồ)
function drawGearIcon(item, x, y, r) {
  ctx.save(); ctx.translate(x, y); ctx.lineCap = "round";
  if (item === "gun") {

    txt(label, cx + 24, y, { size: 12, bold: true, color: "#cfd8dc" });
    if (!ks.length) { txt("(trống)", cx + 120, y, { size: 12, color: "#9fb3c0" }); return; }
    ks.forEach((kk, i) => { drawItem(kk, cx + 160 + i * 52, y, 10); txt("×" + items[kk], cx + 174 + i * 52, y + 1, { size: 13, bold: true }); });
  };
  if (tr.from === "gather") { row("Mẻ sáng nay", tr.haul, cy + 132); row("Kho mang ra quán", tr.stock, cy + 166); }
  else { txt("Thu ca tối: +" + (tr.money || 0) + "k", w / 2, cy + 136, { size: 18, bold: true, align: "center", color: "#ffe48a" }); row("Kho còn lại", tr.stock, cy + 172); }
  rr(cx + 24, cy + ch - 36, cw - 48, 8, 4); ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fill();
  rr(cx + 24, cy + ch - 36, (cw - 48) * k, 8, 4); ctx.fillStyle = "#ffe48a"; ctx.fill();
  ctx.globalAlpha = 1;
}

// =====================================================================================
// Ô đồ nghề (HUD) + tiệm đồ lặn (bảng mua bán)
// =====================================================================================
function drawToolSlots(w, h, L, t, compact) {
  const gear = L.gear; if (!gear) return;
  const n = (shopCfg() || {}).slots || 5, sz = 40, gap = 6, pw = n * (sz + gap) + 14;
  const x0 = compact ? 12 : w - pw - 12, y0 = compact ? h - 150 : h - 112;
  panel(x0, y0, pw, sz + 30, 0.7);
  txt("Đồ nghề " + gear.slots.length + "/" + n, x0 + 10, y0 + 11, { size: 11, bold: true, color: "#ffe7b5" });
  for (let i = 0; i < n; i++) {
    const bx = x0 + 7 + i * (sz + gap), by = y0 + 22, it = gear.slots[i];
    rr(bx, by, sz, sz, 8); ctx.fillStyle = it ? "rgba(255,240,200,.12)" : "rgba(255,255,255,.05)"; ctx.fill();
    ctx.strokeStyle = it ? "rgba(255,228,138,.45)" : "rgba(255,255,255,.12)"; ctx.lineWidth = 1; ctx.stroke();
    if (!it) continue;
    drawGearIcon(it, bx + sz / 2, by + sz / 2, sz * 0.32);
    let badge = "";
    if (it === "gun") badge = "×" + (gear.gun_ammo || 0);
    if (it === "armor") badge = "◆".repeat(gear.armor_hp || 0);
    if (badge) txt(badge, bx + sz - 3, by + sz - 6, { size: 10, bold: true, align: "right", shadow: true, color: it === "armor" ? "#9fe8ff" : "#ffe48a" });
  }
}

const SHOP = { tab: 0 };
function shopItems() { return ITEMS.filter((it) => ((shopCfg() || {}).items || {})[it]); }
function shopBuy(it) { act({ type: "buy", item: it }); }
function shopSell(it) { act({ type: "sell", item: it }); }
function shopKey(k, e) {
  if (k === "escape") { act({ type: "close" }); return true; }
  if (/^[1-9]$/.test(k)) {
    const i = +k - 1, gear = gearOf();
    if (e.shiftKey) { const it = (gear.slots || [])[i]; if (it) shopSell(it); return true; }
    const list = shopItems();
    if (i < list.length) shopBuy(list[i]); else if (i === list.length) shopBuy("basket");
    return true;
  }
  return false;
}
function drawShopPanel(w, h, t) {
  if (!shopUI()) return;
  const L = latest, cfg = shopCfg(), gear = gearOf(), money = gear.money ?? L.money ?? 0;
  const list = shopItems(), nSlots = cfg.slots || 5, full = (gear.slots || []).length >= nSlots;
  const pw = Math.min(720, w - 24), rows = list.length + 1, rh = Math.min(46, Math.max(30, (h - 300) / rows));
  const ph = Math.min(h - 30, 150 + rows * rh + 40), x0 = (w - pw) / 2, y0 = Math.max(12, (h - ph) / 2);
  ctx.fillStyle = "rgba(4,8,14,.45)"; ctx.fillRect(0, 0, w, h);
  panel(x0, y0, pw, ph, 0.95);
  drawGearIcon("tank", x0 + 30, y0 + 28, 12);
  txt("Tiệm đồ lặn", x0 + 50, y0 + 22, { size: 18, bold: true, color: "#ffe48a" });
  txt("Mua đồ dùng cả ngày, mang theo qua các ngày sau", x0 + 50, y0 + 40, { size: 11, color: "#9fb3c0" });
  txt("Két: " + money + "k", x0 + pw - 56, y0 + 26, { size: 16, bold: true, align: "right", color: "#ffe48a" });
  btn(x0 + pw - 42, y0 + 12, 28, 28, () => act({ type: "close" })); txt("✕", x0 + pw - 28, y0 + 26, { size: 14, bold: true, align: "center" });
  // ô đồ đang mang (bấm để bán lại nửa giá)
  const sz = 44, sy = y0 + 56;
  txt("Ô đồ " + gear.slots.length + "/" + nSlots + "  (Shift+số hoặc bấm ô để bán lại ½ giá)", x0 + 18, sy + 2, { size: 11, color: full ? "#ff9b8a" : "#cfd8dc" });
  for (let i = 0; i < nSlots; i++) {
    const bx = x0 + 18 + i * (sz + 8), by = sy + 12, it = gear.slots[i];
    if (it) btn(bx, by, sz, sz, () => shopSell(it), false); else { rr(bx, by, sz, sz, 8); ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fill(); ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.stroke(); }
    if (it) { drawGearIcon(it, bx + sz / 2, by + sz / 2 - 3, sz * 0.3); txt("+" + Math.floor(cfg.items[it].price * (cfg.sell_rate || 0.5)) + "k", bx + sz / 2, by + sz - 6, { size: 9, bold: true, align: "center", color: "#ffe48a" }); }
    else txt(String(i + 1), bx + sz / 2, by + sz / 2, { size: 11, align: "center", color: "rgba(255,255,255,.25)" });
  }
  // danh sách hàng
  const ly = sy + 66;
  const row = (i, icon, name, desc, price, status, ok, fn) => {
    const ry = ly + i * rh;
    btn(x0 + 18, ry, pw - 36, rh - 5, () => ok && fn(), ok);
    txt(String(i + 1), x0 + 34, ry + (rh - 5) / 2, { size: 13, bold: true, align: "center", color: "#ffe48a" });
    drawGearIcon(icon, x0 + 66, ry + (rh - 5) / 2, Math.min(14, rh * 0.32));
    txt(name, x0 + 90, ry + (rh - 5) / 2 - (rh > 36 ? 8 : 0), { size: 13, bold: true, color: ok ? "#fff" : "#b8c6ce" });
    if (rh > 36) txt(desc, x0 + 90, ry + (rh - 5) / 2 + 9, { size: 11, color: "#9fb3c0" });
    txt(price, x0 + pw - 150, ry + (rh - 5) / 2, { size: 14, bold: true, align: "right", color: money >= parseInt(price) ? "#ffe48a" : "#ff8a80" });
    txt(status, x0 + pw - 34, ry + (rh - 5) / 2, { size: 12, bold: true, align: "right", color: ok ? "#b8ff8a" : "#9fb3c0" });
  };
  list.forEach((it, i) => {
    const owned = gear.slots.includes(it), price = cfg.items[it].price;
    const status = owned ? (it === "armor" ? "Đang mặc (" + gear.armor_hp + ")" : "Đã có") : full ? "Hết ô" : money < price ? "Thiếu tiền" : "Mua";
    row(i, it, ITEM_NAME[it], ITEM_DESC[it], price + "k", status, !owned && !full && money >= price, () => shopBuy(it));
  });
  const bk = cfg.basket || { prices: [], step: 4 }, lv = gear.basket_level || 0, maxed = lv >= bk.prices.length, bp = maxed ? 0 : bk.prices[lv];
  row(list.length, "basket", ITEM_NAME.basket + "  (cấp " + lv + "/" + bk.prices.length + " · giỏ " + (L.hold_capacity || 12) + " ô)",
      ITEM_DESC.basket + " · không chiếm ô đồ", maxed ? "—" : bp + "k", maxed ? "Tối đa" : money < bp ? "Thiếu tiền" : "Nâng cấp", !maxed && money >= bp, () => shopBuy("basket"));
  txt("Bấm số hoặc click để mua · Esc đóng · Mỗi món chỉ mua 1 cái, giáp vỡ rồi mới mua lại", x0 + pw / 2, y0 + ph - 14, { size: 11, align: "center", color: "#9fb3c0" });
}

// =====================================================================================
// Lớp phủ chung
// =====================================================================================
function drawToasts(w, t) {
  const leftSide = latest && latest.meta && latest.meta.view === "side";
  let y = leftSide ? 66 : latest && latest.mode === "quan" ? (w < 760 ? 160 : 90) : 110;
  for (let i = toasts.length - 1; i >= 0; i--) {
    const tt = toasts[i], a = tt.t < 0.2 ? tt.t / 0.2 : tt.t > 3.4 ? (4 - tt.t) / 0.6 : 1, slide = (1 - Math.min(1, tt.t / 0.2)) * 30;
    const tw = textW(tt.text, 13, true) + 28;
    const fw = tt.face ? 26 : 0;
    const bx = leftSide ? 12 - slide : w - tw - fw - 14 + slide;
    ctx.globalAlpha = a; panel(bx, y, tw + fw, 30, 0.75);
    if (tt.face) drawFace(bx + 16, y + 15, 10, tt.face, t);
    txt(tt.text, bx + fw + tw / 2, y + 15, { size: 13, bold: true, align: "center", color: tt.color });
    ctx.globalAlpha = 1; y += 36;
  }
}
const REASON = { docked: "Cập bến an toàn!", time: "Hết giờ", fainted: "Ngất xỉu — mất giỏ hàng", error: "Luật báo lỗi" };
let endT = 0;
function overlay(w, h, dt, t) {
  if (offline) { panel(w / 2 - 190, 14, 380, 34, 0.85); txt("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 31, { align: "center", color: "#ff8a80", bold: true }); }
  if (latest.error) { panel(w / 2 - 230, 54, 460, 34, 0.85); txt("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 71, { align: "center", color: "#ff8a80", bold: true }); }
  if (latest.finished) {
    endT = Math.min(1, endT + dt * 2.5); const k = 1 - Math.pow(1 - endT, 3);
    ctx.fillStyle = `rgba(5,10,16,${0.55 * k})`; ctx.fillRect(0, 0, w, h);
    const cw = Math.min(440, w - 32), ch = 220, cx = w / 2 - cw / 2, cy = h / 2 - ch / 2 + (1 - k) * 40;
    ctx.globalAlpha = k; panel(cx, cy, cw, ch, 0.92);
    const g = latest.mode === "gather";
    txt(g ? "Buổi sáng kết thúc" : "Quán đóng cửa", w / 2, cy + 36, { size: 14, semi: true, align: "center", color: "#cfd8dc" });
    txt(REASON[latest.reason] || latest.reason || "", w / 2, cy + 70, { size: 26, bold: true, align: "center", color: latest.reason === "fainted" ? "#ff8a80" : "#ffe48a" });
    if (g) {
      const hold = latest.hold || [], counts = {}; hold.forEach((k2) => (counts[k2] = (counts[k2] || 0) + 1));
      const ks = Object.keys(counts);
      if (!ks.length) txt("Giỏ trống", w / 2, cy + 120, { size: 14, align: "center", color: "#9fb3c0" });
      ks.forEach((k2, i) => { const xx = w / 2 + (i - (ks.length - 1) / 2) * 90; drawItem(k2, xx - 14, cy + 120, 14); txt("×" + counts[k2], xx + 4, cy + 121, { size: 16, bold: true }); txt(kname(k2), xx, cy + 146, { size: 11, align: "center", color: "#cfd8dc" }); });
    } else {
      txt(`Thu ${latest.money ?? 0}k  ·  Uy tín ${(latest.reputation ?? 0).toFixed(1)}  ·  Điểm ${latest.score ?? 0}`, w / 2, cy + 120, { size: 16, bold: true, align: "center" });
    }
    keycap(w / 2 - 40, cy + ch - 10, "R", "Chơi lại", t);
    ctx.globalAlpha = 1;
  } else endT = 0;
}
function eventLog(w, h) {
  const ev = (latest.events || []).slice(-8);
  panel(w - 470, h - 80 - ev.length * 15, 458, ev.length * 15 + 12, 0.75);
  ev.forEach((e, i) => { let d = ""; try { d = JSON.stringify(e.data); } catch (er) { } if (d.length > 52) d = d.slice(0, 50) + "…"; txt(`t${e.tick} ${e.name} ${d}`, w - 462, h - 74 - (ev.length - i) * 15 + 15, { size: 11, color: "rgba(232,238,242,.85)" }); });
  txt(`tick ${latest.tick} · buffer ${buf.length} · fps ${fps.toFixed(0)}`, w - 462, h - 88 - ev.length * 15, { size: 11, color: "#9fe", shadow: true });
}

// =====================================================================================
// Vòng vẽ
// =====================================================================================
let lastT = performance.now(), fps = 60;
function frame(now) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const dt = clamp((now - lastT) / 1000, 0, 0.05); lastT = now; fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
  const t = now / 1000;
  const [w, h] = fit();
  ctx.fillStyle = "#0b1620"; ctx.fillRect(0, 0, w, h);
  updateParts(dt);
  if (latest) {
    hits = [];
    if (latest.mode === "quan") { if ((latest.meta || {}).view === "side") drawQuanSide(w, h, dt, t); else drawQuan(w, h, dt, t); }
    else drawGather(w, h, dt, t);
    drawToasts(w, t);
    drawTransition(w, h, t);
    if (debug) eventLog(w, h);
    overlay(w, h, dt, t);
  } else {
    txt("Quán Ăn Chợ Nổi", w / 2, h / 2 - 20, { align: "center", size: 30, bold: true, color: "#ffe48a" });
    txt(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2 + 18, { align: "center", size: 16, color: "#cfd8dc" });
  }
}
requestAnimationFrame(frame);
</script>
